<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sanka Flow</title>
    <style>
      :root {
        font-family: var(--font-sans, system-ui);
        color: var(--color-text-primary, CanvasText);
        background: var(--color-background-primary, Canvas);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      main {
        max-width: 760px;
        margin: auto;
        padding: 24px;
      }
      header,
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      h1 {
        font-size: 24px;
        margin: 4px 0 8px;
        font-weight: 600;
      }
      p {
        line-height: 1.5;
        margin: 8px 0;
      }
      .muted,
      small {
        color: var(--color-text-secondary, GrayText);
      }
      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      header {
        padding-bottom: 24px;
      }
      button {
        font: inherit;
        font-size: 14px;
        border: 1px solid var(--color-border-primary, ButtonBorder);
        border-radius: var(--border-radius-md, 8px);
        padding: 10px 12px;
        background: var(--color-background-primary, Canvas);
        color: inherit;
      }
      button {
        cursor: pointer;
        white-space: nowrap;
        font-weight: 500;
      }
      button.primary {
        background: var(--color-background-inverse, CanvasText);
        color: var(--color-text-inverse, Canvas);
        border-color: transparent;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      :focus-visible {
        outline: 2px solid var(--color-text-primary, Highlight);
        outline-offset: 3px;
      }
      #notice {
        margin: 0 0 16px;
      }
      #workspace-id {
        display: block;
        overflow-wrap: anywhere;
      }
      [hidden] {
        display: none !important;
      }
      #workspace-frame {
        flex: 1;
        min-height: 0;
      }
      #workspace-frame iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      #full-workspace {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .full-workspace main {
        height: 100vh;
        display: flex;
        flex-direction: column;
        max-width: none;
        padding: 0;
      }
      .full-workspace:not(.workspace-recovery) #workspace-launch,
      .full-workspace:not(.workspace-recovery) #workspace-retry {
        display: none;
      }
      .full-workspace main > header {
        display: none;
      }
      .full-workspace #workspace-launch {
        padding: 8px 16px;
      }
      .full-workspace #workspace-launch > p,
      .full-workspace #open-workspace {
        display: none;
      }
      .full-workspace #notice {
        padding: 0 16px;
        margin: 0;
      }
      #workspace-launch {
        padding-bottom: 16px;
      }
      #workspace-controls {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      @media (max-width: 480px) {
        main {
          padding: 16px;
        }
        .row {
          align-items: stretch;
          flex-direction: column;
        }
        header {
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <div class="eyebrow muted">Sanka Flow</div>
          <h1 id="workspace-name">Sanka Flow</h1>
          <small id="workspace-id">Connecting…</small>
        </div>
        <div class="row">
          <button id="language" disabled>日本語</button
          ><button id="refresh" disabled data-en="Refresh" data-ja="再読み込み">Refresh</button>
        </div>
      </header>
      <p id="notice" role="status" aria-live="polite"></p>
      <button id="connect" type="button" hidden data-en="Connect Sanka" data-ja="Sankaに接続">
        Connect Sanka
      </button>
      <div id="workspace-launch" hidden>
        <p
          data-en="Use the Sanka sidebar, dashboard, record tables, workflows, and reports in ChatGPT."
          data-ja="ChatGPT内でSankaのサイドバー・ダッシュボード・レコード一覧・ワークフロー・レポートを利用できます。"
        >
          Use the Sanka sidebar, dashboard, record tables, workflows, and reports in ChatGPT.
        </p>
        <p id="workspace-consent" class="muted">
          Reconnect Sanka and choose Full Flow workspace to enable this view.
        </p>
        <div id="workspace-controls">
          <button
            id="enable-workspace"
            type="button"
            class="primary"
            hidden
            data-en="Enable full workspace"
            data-ja="ワークスペース全体へのアクセスを許可"
          >
            Enable full workspace
          </button>
          <button
            id="open-workspace"
            type="button"
            class="primary"
            disabled
            data-en="Open workspace"
            data-ja="ワークスペースを開く"
          >
            Open workspace
          </button>
          <button
            id="workspace-external"
            type="button"
            data-en="Open workspace in Sanka"
            data-ja="ワークスペースをSankaで開く"
          >
            Open workspace in Sanka
          </button>
        </div>
      </div>
      <div id="full-workspace" hidden>
        <div id="workspace-frame"></div>
        <button
          id="workspace-retry"
          type="button"
          data-en="Reopen workspace"
          data-ja="ワークスペースを開き直す"
        >
          Reopen workspace
        </button>
      </div>
    </main>
    <!-- WORKSPACE_CONFIG -->
    <!-- APP_SCRIPT -->
  </body>
</html>
